services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caddy
      POSTGRES_USER: caddy
      POSTGRES_PASSWORD: caddy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caddy -d caddy"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "3500:3500"
    environment:
      PORT: "3500"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: caddy
      DB_USER: caddy
      DB_PASSWORD: caddy
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-admin}
      SEED_PASSWORD: ${SEED_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: "http://localhost:3500"
    depends_on:
      - api

volumes:
  pgdata:
