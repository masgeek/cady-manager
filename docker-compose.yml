services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER:-caddy}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-caddy}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-caddy} -d ${DB_NAME:-caddy}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web
      - internal

  migrate:
    image: caddy-manager-migrate:${TAG:-latest}
    container_name: migrate
    build:
      context: .
      dockerfile: apps/api/Dockerfile.migrations
    environment:
      DB_USER: ${DB_USER:-caddy}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-caddy}
      SEED_EMAIL: ${SEED_EMAIL:-admin@caddy.local}
      SEED_USERNAME: ${SEED_USERNAME:-admin}
      SEED_PASSWORD: ${SEED_PASSWORD:?SEED_PASSWORD is required}
      SEED_ROLE: ${SEED_ROLE:-admin}
    depends_on:
      db:
        condition: service_healthy
    restart: no
    networks:
      - web
      - internal

  api:
    image: caddy-manager-api:${TAG:-latest}
    container_name: api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3500
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_USERNAME: ${AUTH_USERNAME:?AUTH_USERNAME is required}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?AUTH_PASSWORD is required}
      DB_USER: ${DB_USER:-caddy}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-caddy}
      SEED_EMAIL: ${SEED_EMAIL:-admin@caddy.local}
      SEED_USERNAME: ${SEED_USERNAME:-admin}
      SEED_PASSWORD: ${SEED_PASSWORD:?SEED_PASSWORD is required}
      SEED_ROLE: ${SEED_ROLE:-admin}
    ports:
      - "${API_PORT:-3500}:3500"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - web
      - internal

  web:
    image: caddy-manager-web:${TAG:-latest}
    container_name: web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - web
      - internal

networks:
  web:
    external: true
  internal:
    external: true

volumes:
  db_data:
