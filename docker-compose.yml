services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caddy_manager
      POSTGRES_USER: caddy
      POSTGRES_PASSWORD: caddy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caddy -d caddy_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DATABASE_URL: "postgres://caddy:caddy@postgres:5432/caddy_manager"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: "http://localhost:3001"
    depends_on:
      - api

volumes:
  pgdata:
